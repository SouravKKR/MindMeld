<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CogniumLearn — Sign in</title>

    <!-- Explicit favicon so browsers stop auto-requesting /favicon.ico (which
         the server does not serve, producing a 404 on every page load). -->
    <link rel="icon" type="image/png" href="./Globals/Assets/Images/Logos/CogniumLearnLogoIcon.png">
    <link rel="apple-touch-icon" href="./Globals/Assets/Images/Logos/CogniumLearnLogoIcon.png">

    <link rel="stylesheet" href="./CommonStyles/Theme.css">
    <link rel="stylesheet" href="./Pages/Login/Styles/LoginPage.css">

    <!-- The sign-in shell now carries the public report channel: a copyright /
         IP complaint and "I can't sign in" are both reachable without an
         account, so the dialog they open needs its chrome here as well as in
         the app shell. -->
    <link rel="stylesheet" href="./CommonStyles/DialogBox.css">
    <link rel="stylesheet" href="./CommonStyles/ReportIssueDialog.css">

    <!-- jsPDF is loaded as a plain (non-module) script so the bundler
         leaves it alone. LegalDocumentPdfRenderer reads window.jspdf.jsPDF
         at the moment the user clicks a legal link, so it only matters
         that the global is present by then. -->
    <script src="./ThirdParty/JsPdf/jspdf.umd.min.js"></script>

    <script src="./CommonComponents/CopyrightNotice.js" type="module"></script>
    <script src="./Pages/Login/LoginPage.js" type="module"></script>
    <script src="./Globals/Classes/OfflineCacheManager.js" type="module"></script>
</head>
<body>
    <login-page></login-page>
</body>
</html>
