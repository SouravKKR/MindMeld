<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CogniumLearn</title>
    <style>
        html, body { height: 100%; margin: 0; background: #0f1117; color: #e8eaf0; font-family: system-ui, sans-serif; }
        .center { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; }
        .muted { color: #9aa0ad; font-size: 14px; }
    </style>
</head>
<body>
    <!--
        Placeholder only. ConfigureTauriApp.js rewrites this file on every build
        with the environment's real application URL, so the copy in version
        control exists to keep `frontendDist` pointing at a directory that is
        never empty — a Tauri build fails outright on a missing frontendDist,
        which would make a fresh clone unbuildable until the first configure
        step happened to run.

        The window normally loads the deployed site directly; this page is only
        reached if the very first launch happens with no network, before the
        service worker has cached anything.
    -->
    <div class="center">
        <h1>CogniumLearn</h1>
        <p class="muted">Connecting to CogniumLearn. If you are offline, please reconnect and reopen the app.</p>
    </div>
</body>
</html>
