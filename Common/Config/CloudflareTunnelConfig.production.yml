# Cloudflare Tunnel config for the PRODUCTION base node (Linux/Debian).
#
# This mirrors CloudflareTunnelConfig.yml (used by run.ps1 --online on Windows dev)
# but with Linux paths. Deploy it to /etc/cloudflared/config.yml on the base node.
#
# The tunnel terminates TLS at Cloudflare's edge and forwards to Dock on
# 127.0.0.1:3000 over the encrypted tunnel, so the base node never exposes port
# 3000 (or any inbound port) publicly. See Common/ReadmeFiles/Deployment.md §1.8.

tunnel: mindmeld
# Copy this tunnel's credentials JSON from the machine that created the tunnel
# (the UUID matches the dev config). On the base node it lives under /etc/cloudflared.
credentials-file: /etc/cloudflared/6156d866-df7e-47eb-a5e5-43810724ea26.json

ingress:
  - hostname: mindmeld.cogniumlabs.io
    service: http://127.0.0.1:3000
  - service: http_status:404
